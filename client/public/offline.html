<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - DonateMatch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    p {
      color: #a5b4fc;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #6366f1;
      color: white;
      padding: 12px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4f46e5;
    }
    .tips {
      margin-top: 40px;
      text-align: left;
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 12px;
    }
    .tips h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }
    .tips ul {
      list-style: none;
      color: #c7d2fe;
    }
    .tips li {
      padding: 5px 0;
    }
    .tips li::before {
      content: "✓ ";
      color: #34d399;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Don't worry, some features are still available!</p>
    <a href="/" class="btn" onclick="window.location.reload()">Try Again</a>
    
    <div class="tips">
      <h3>While offline, you can:</h3>
      <ul>
        <li>View your saved donations</li>
        <li>Browse cached charity profiles</li>
        <li>Read downloaded impact stories</li>
      </ul>
    </div>
  </div>
  
  <script>
    // Auto reload when back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
